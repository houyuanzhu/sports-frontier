name: 网站检查与免费部署
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 0 * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 更新、补检允许访问的故障来源或恢复快照
        type: choice
        options: [update, recover, rollback]
        default: update
      rollback_ref:
        description: 回滚时填写content-data分支的完整提交SHA
        type: string
        required: false
permissions: {}
concurrency:
  group: sports-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  schedule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
      reason: ${{ steps.guard.outputs.reason }}
      day: ${{ steps.guard.outputs.day }}
      ids: ${{ steps.guard.outputs.ids }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule' || inputs.mode == 'recover'
        with:
          persist-credentials: false
      - id: guard
        name: 确定正常采集、补检或跳过
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          PAGES_HEALTH: https://houyuanzhu.github.io/sports-frontier/health.json
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$INPUT_MODE" != recover ]; then
            printf 'skip=false\nmode=normal\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export RUN_CREATED_AT
          RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          if curl -fsS --max-time 15 "$PAGES_HEALTH?run=$GITHUB_RUN_ID" -o health.json; then
            plan=$(node scripts/schedule-guard.mjs health.json)
          else
            plan=$(node scripts/schedule-guard.mjs)
          fi
          printf '调度决策：%s\n' "$plan" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"mode="+.mode,"reason="+.reason,"day="+.day,"ids="+(.ids|join(",")),"skip="+(.mode=="skip"|tostring)' <<< "$plan" >> "$GITHUB_OUTPUT"
  build:
    needs: schedule-check
    if: needs.schedule-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      site_id: ${{ steps.identity.outputs.site_id }}
      publication_enabled: ${{ steps.identity.outputs.publication_enabled }}
      all_failed: ${{ steps.collect.outputs.all_failed }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 读取发布门禁
        id: identity
        run: |
          node --input-type=module -e "import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('src/data/site.json'));const c=JSON.parse(fs.readFileSync('sources/config.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'site_id='+s.siteId+'\npublication_enabled='+c.autoPublish+'\n')"
      - name: 恢复持久化历史（读取失败则停止，不用空数据覆盖历史）
        if: steps.identity.outputs.publication_enabled == 'true'
        env:
          ROLLBACK_REF: ${{ inputs.mode == 'rollback' && inputs.rollback_ref || '' }}
        run: |
          if [ '${{ inputs.mode }}' = rollback ] && [ -z "$ROLLBACK_REF" ]; then exit 1; fi
          node scripts/content-state.mjs restore
      - name: 真实采集、核验与去重（单源故障隔离）
        id: collect
        if: inputs.mode != 'rollback'
        env:
          ENABLED: ${{ steps.identity.outputs.publication_enabled }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          COLLECTION_MODE: ${{ needs.schedule-check.outputs.mode }}
          RECOVERY_DAY: ${{ needs.schedule-check.outputs.day }}
          RECOVERY_IDS: ${{ needs.schedule-check.outputs.ids }}
        run: |
          if [ "$ENABLED" = true ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            node scripts/collect.mjs --publish
          else
            node scripts/collect.mjs
          fi
      - name: 单元测试、构建与全站链接检查
        run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: 中文、响应式和交互测试
        run: npm run test:browser
      - name: 记录本次内容摘要
        id: digest
        run: node --input-type=module -e "import fs from 'node:fs';import{createHash}from'node:crypto';fs.appendFileSync(process.env.GITHUB_OUTPUT,'digest='+createHash('sha256').update(fs.readFileSync('src/data/articles.json')).digest('hex')+'\n')"
      - name: 保存真实采集与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.identity.outputs.publication_enabled == 'true' && github.event_name != 'pull_request'
        with:
          name: validated-content
          path: reports/publish-bundle/
          retention-days: 2
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  persist:
    if: github.event_name != 'pull_request' && needs.build.outputs.publication_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: validated-content
          path: bundle
      - name: 原子保存已验证快照（仅写独立数据分支）
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/content-state.mjs persist bundle
  deploy:
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.persist.result == 'success' || needs.persist.result == 'skipped')
    needs: [build, persist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布静态页面（失败保留上一版本）
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 核验公开页面、代码提交与内容摘要
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_ID: ${{ needs.build.outputs.site_id }}
          COMMIT_SHA: ${{ github.sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail --location --retry 2 --max-time 30 "$PAGE_URL" -o /tmp/page.html &&
               curl --fail --location --retry 2 --max-time 30 "${PAGE_URL%/}/health.json" -o /tmp/health.json &&
               grep -Fq 'lang="zh-CN"' /tmp/page.html &&
               grep -Fq "name=\"site-id\" content=\"$SITE_ID\"" /tmp/page.html &&
               jq -e --arg id "$SITE_ID" --arg sha "$COMMIT_SHA" --arg digest "$DIGEST" '.siteId == $id and .buildCommit == $sha and .contentDigest == $digest' /tmp/health.json; then
              echo '公开页面、当前代码与内容快照核验通过。' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
  check-result:
    if: always()
    needs: [schedule-check, build, persist, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          persist-credentials: false
      - name: 记录定时触发与发布时点
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          GATE_SKIP: ${{ needs.schedule-check.outputs.skip }}
          GATE_MODE: ${{ needs.schedule-check.outputs.mode }}
          GATE_REASON: ${{ needs.schedule-check.outputs.reason }}
          GATE_IDS: ${{ needs.schedule-check.outputs.ids }}
        run: |
          case "$SCHEDULE_CRON" in
            '10 0 * * *') clock=08:10 ;;
            '37 3 * * *') clock=11:37 ;;
            *) exit 1 ;;
          esac
          node scripts/run-timing.mjs "$GITHUB_RUN_ID@$clock" > schedule-timing.json
          cat schedule-timing.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule'
        with:
          name: schedule-timing
          path: schedule-timing.json
          retention-days: 21
      - name: 保留失败信号，不将检查成功等同资讯更新
        env:
          ALL_FAILED: ${{ needs.build.outputs.all_failed }}
          BUILD: ${{ needs.build.result }}
          PERSIST: ${{ needs.persist.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SKIP: ${{ needs.schedule-check.outputs.skip }}
        run: |
          if [ "$SKIP" = true ]; then exit 0; fi
          test "$BUILD" = success
          test "$PERSIST" = success -o "$PERSIST" = skipped
          test "$DEPLOY" = success -o "$DEPLOY" = skipped
          test "$ALL_FAILED" != true
